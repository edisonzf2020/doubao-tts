# 豆包 TTS OpenAI 兼容服务
#
# 首次使用:
#   1. cp .env.example .env        # 改掉 DOUBAO_TTS_API_KEY
#   2. 准备 cookie（任选其一）:
#        printf '%s\n' "浏览器复制的 Cookie 头" > .cookie
#        或把扩展导出的 JSON 存为 .doubao_cookie
#      两个文件都要先存在（可为空），否则 Docker 会把挂载源建成目录:
#        touch .cookie .doubao_cookie
#   3. docker compose up -d

services:
  doubao-tts:
    build: .
    image: doubao-tts:latest
    container_name: doubao-tts
    restart: unless-stopped

    # .env 里的变量由 compose 注入为环境变量（优先级高于容器内 .env）
    env_file:
      - .env

    ports:
      # 左侧宿主端口可改；右侧固定 8000（镜像内监听端口）
      - "8000:8000"

    # 容器内固定监听 0.0.0.0:8000，对外暴露由 ports 控制
    environment:
      DOUBAO_TTS_HOST: 0.0.0.0
      DOUBAO_TTS_PORT: 8000

    volumes:
      # cookie 需要可读写：保温续期会回写这两个文件
      - ./.cookie:/app/.cookie
      - ./.doubao_cookie:/app/.doubao_cookie
      # 音色表挂出来，方便重新抓取后立即生效（fetch_voices.py 会写它）
      - ./voices.json:/app/voices.json

    # 合成是网络 IO 密集型；限内存防失控（mem_limit 对 compose 生效）
    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
