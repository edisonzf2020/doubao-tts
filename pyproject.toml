[project]
name = "doubao-tts"
version = "1.0.0"
description = "豆包 TTS 逆向客户端 + OpenAI 兼容服务"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
    # OpenAI 兼容服务 (openai_server.py) 所需
    "fastapi==0.120.4",
    "uvicorn[standard]==0.41.0",
    # 读取 .env（虽是 uvicorn[standard] 的传递依赖，但代码直接 import，需显式声明）
    "python-dotenv==1.2.3",
]

[tool.uv]
# 纯脚本项目，不构建成包；直接用 uv run python <脚本>.py 运行
package = false
